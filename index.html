<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>完了！我被男同学包围～高地探险篇～</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          pink: {
            50:  'hsl(340, 100%, 98%)',
            100: 'hsl(340, 95%, 94%)',
            200: 'hsl(340, 90%, 88%)',
            300: 'hsl(340, 85%, 78%)',
            400: 'hsl(340, 80%, 68%)',
            500: 'hsl(340, 75%, 60%)',
            600: 'hsl(340, 70%, 50%)',
          },
          purple: {
            soft: 'hsl(270, 80%, 92%)',
            deep: 'hsl(270, 60%, 50%)',
          },
          cream: 'hsl(40, 80%, 98%)',
        },
        fontFamily: {
          title: ['"ZCOOL KuaiLe"', '"Ma Shan Zheng"', 'sans-serif'],
          body: ['"Noto Serif SC"', 'serif'],
          cute: ['"Ma Shan Zheng"', 'cursive'],
        },
        boxShadow: {
          soft: '0 8px 30px hsl(340 80% 70% / 0.2)',
          glow: '0 0 20px hsl(340 90% 75% / 0.5)',
        },
        animation: {
          'float': 'float 3s ease-in-out infinite',
          'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
          'fade-in': 'fadeIn 0.6s ease-out',
          'slide-up': 'slideUp 0.5s ease-out',
          'heart-beat': 'heartBeat 1.2s ease-in-out infinite',
          'sparkle': 'sparkle 1.5s ease-in-out infinite',
        },
        keyframes: {
          float: {
            '0%, 100%': { transform: 'translateY(0)' },
            '50%': { transform: 'translateY(-10px)' },
          },
          pulseSoft: {
            '0%, 100%': { opacity: '1' },
            '50%': { opacity: '0.6' },
          },
          fadeIn: {
            '0%': { opacity: '0' },
            '100%': { opacity: '1' },
          },
          slideUp: {
            '0%': { opacity: '0', transform: 'translateY(20px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          heartBeat: {
            '0%, 100%': { transform: 'scale(1)' },
            '15%': { transform: 'scale(1.25)' },
            '30%': { transform: 'scale(1)' },
            '45%': { transform: 'scale(1.15)' },
            '60%': { transform: 'scale(1)' },
          },
          sparkle: {
            '0%, 100%': { opacity: '0', transform: 'scale(0.5) rotate(0deg)' },
            '50%': { opacity: '1', transform: 'scale(1) rotate(180deg)' },
          },
        },
      }
    }
  };
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img, video { max-width: 100%; height: auto; display: block; }
body { overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: '"Noto Serif SC"', serif;
}
#game-root {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: hsl(340, 95%, 94%);
  user-select: none;
  -webkit-user-select: none;
}
/* ========== 背景层 ========== */
.bg-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.8s ease;
  z-index: 0;
}
.bg-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(340, 95%, 94%) 50%,
    hsl(270, 90%, 94%) 100%);
  z-index: 0;
}
.bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, hsl(340 50% 20% / 0.35) 100%);
  z-index: 1;
  pointer-events: none;
}
/* ========== 角色立绘 ========== */
.char-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.char-sprite {
  position: absolute;
  bottom: 0;
  height: 85%;
  max-height: 85vh;
  object-fit: contain;
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: translateY(30px);
  filter: drop-shadow(0 10px 20px hsl(340 40% 30% / 0.2));
}
.char-sprite.pos-left   { left: -5%;  }
.char-sprite.pos-center { left: 50%; transform: translateX(-50%) translateY(0); }
.char-sprite.pos-right  { right: -5%; }
.char-sprite.active {
  opacity: 1;
}
.char-sprite.active.pos-left   { transform: translateX(0) translateY(0); }
.char-sprite.active.pos-right  { transform: translateX(0) translateY(0); }
.char-sprite.active.pos-center { transform: translateX(-50%) translateY(0); }
.char-sprite.dim {
  filter: drop-shadow(0 10px 20px hsl(340 40% 30% / 0.15)) brightness(0.6) saturate(0.7);
  opacity: 0.5;
}
.char-sprite.speaking {
  transform: translateY(-8px) scale(1.02);
  filter: drop-shadow(0 15px 25px hsl(340 50% 40% / 0.3));
}
.char-sprite.pos-center.speaking {
  transform: translateX(-50%) translateY(-8px) scale(1.03);
}
@media (max-width: 640px) {
  .char-sprite { height: 70%; }
  .char-sprite.pos-left   { left: -15%; }
  .char-sprite.pos-right  { right: -15%; }
}
/* ========== 对话框 ========== */
.dialog-box {
  position: absolute;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 720px;
  background: linear-gradient(135deg,
    hsl(0, 0%, 100%) 0%,
    hsl(340, 100%, 98%) 100%);
  border-radius: 20px;
  border: 2px solid hsl(340, 85%, 85%);
  padding: 20px 24px 20px;
  box-shadow: 0 8px 32px hsl(340 60% 50% / 0.15),
              inset 0 1px 0 hsl(0 0% 100% / 0.8);
  z-index: 10;
  cursor: pointer;
}
.dialog-box::before {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  border-radius: 22px;
  background: linear-gradient(135deg, hsl(340, 90%, 80%), hsl(270, 80%, 85%));
  z-index: -1;
  opacity: 0.5;
  filter: blur(8px);
}
.char-name {
  display: inline-block;
  padding: 4px 16px;
  background: linear-gradient(135deg, hsl(340, 80%, 68%), hsl(270, 70%, 68%));
  color: white;
  border-radius: 999px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 10px;
  box-shadow: 0 2px 8 hsl(340 70% 50% / 0.3);
}
.dialog-text {
  color: hsl(240, 20%, 25%);
  font-size: 17px;
  line-height: 1.8;
  min-height: 60px;
  white-space: pre-wrap;
  word-break: break-word;
}
@media (max-width: 640px) {
  .dialog-box { bottom: 16px; padding: 14px 16px; border-radius: 16px; }
  .char-name { font-size: 14px; padding: 3px 12px; }
  .dialog-text { font-size: 15px; line-height: 1.7; min-height: 50px; }
}
.triangle {
  position: absolute;
  right: 20px;
  bottom: 12px;
  width: 10px;
  height: 10px;
  border-right: 2px solid hsl(340, 70%, 60%);
  border-bottom: 2px solid hsl(340, 70%, 60%);
  transform: rotate(45deg);
  animation: triangleBounce 1s ease-in-out infinite;
}
@keyframes triangleBounce {
  0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 1; }
  50% { transform: rotate(45deg) translate(3px, 3px); opacity: 0.5; }
}
/* ========== 选项按钮 ========== */
.choice-container {
  position: absolute;
  left: 50%;
  bottom: 180px;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 560px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: slideUp 0.4s ease-out;
}
.choice-btn {
  width: 100%;
  padding: 14px 20px;
  background: linear-gradient(135deg,
    hsl(0, 0%, 100%) 0%,
    hsl(340, 100%, 97%) 100%);
  border: 2px solid hsl(340, 80%, 80%);
  border-radius: 14px;
  color: hsl(340, 70%, 40%);
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
  box-shadow: 0 4px 12px hsl(340 60% 50% / 0.1);
  position: relative;
  overflow: hidden;
}
.choice-btn::before {
  content: '♡';
  margin-right: 10px;
  color: hsl(340, 70%, 65%);
  font-size: 14px;
}
.choice-btn:hover {
  transform: translateY(-2px);
  border-color: hsl(340, 75%, 65%);
  box-shadow: 0 6px 20px hsl(340 70% 50% / 0.2);
  background: linear-gradient(135deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 90%, 95%) 100%);
}
.choice-btn:active {
  transform: translateY(0);
}
@media (max-width: 640px) {
  .choice-container { bottom: 140px; gap: 8px; }
  .choice-btn { padding: 12px 16px; font-size: 14px; border-radius: 12px; }
}
/* ========== HUD 好感度 ========== */
.hud {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  background: hsl(0 0% 100% / 0.85);
  backdrop-filter: blur(8px);
  border-radius: 14px;
  border: 1.5px solid hsl(340, 85%, 88%);
  box-shadow: 0 4px 16px hsl(340 50% 40% / 0.1);
}
.affection-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}
.affection-name {
  white-space: nowrap;
  width: 48px;
  font-weight: 500;
  color: hsl(240, 15%, 35%);
}
.affection-bar {
  width: 60px;
  height: 6px;
  background: hsl(340, 30%, 90%);
  border-radius: 999px;
  overflow: hidden;
}
.affection-fill {
  height: 100%;
  background: linear-gradient(90deg, hsl(340, 85%, 70%), hsl(270, 70%, 70%));
  border-radius: 999px;
  transition: width 0.5s ease;
  box-shadow: 0 0 6px hsl(340 80% 65% / 0.5);
}
.affection-heart {
  font-size: 10px;
  width: 12px;
  color: hsl(340, 75%, 60%);
}
/* 修复菜单按钮 可显示可点击 */
.menu-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 99;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: hsl(0 0% 100% / 0.85);
  backdrop-filter: blur(8px);
  border: 1.5px solid hsl(340, 85%, 88%);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 10px hsl(340 50% 40% / 0.1);
  pointer-events: auto;
}
/* 删掉 hud-active 隐藏规则 */
/* ========== 主菜单 ========== */
.main-menu {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 95%, 94%) 100%);
  overflow: hidden;
}
.main-menu::before {
  content: '';
  position: absolute;
  top: -20%;
  left: -10%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, hsl(340, 90%, 85%) 0%, transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}
.main-menu::after {
  content: '';
  position: absolute;
  bottom: -20%;
  right: -10%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, hsl(270, 85%, 85%) 0%, transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}
.game-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(28px, 6vw, 56px);
  color: hsl(340, 65%, 45%);
  text-align: center;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 hsl(340, 100%, 90%),
               4px 4px 16px hsl(340 70% 50% / 0.2);
  line-height: 1.3;
  z-index: 1;
  animation: float 4s ease-in-out infinite;
}
.game-subtitle {
  font-family: '"Ma Shan Zheng"', cursive;
  font-size: clamp(16px, 3vw, 24px);
  color: hsl(270, 50%, 50%);
  margin-bottom: 40px;
  z-index: 1;
  opacity: 0.85;
}
.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 1;
  width: min(280px, 80%);
}
.menu-btn-main {
  padding: 14px 28px;
  background: linear-gradient(135deg, hsl(340, 80%, 70%), hsl(270, 70%, 70%));
  color: white;
  border: none;
  border-radius: 999px;
  font-size: 18px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  cursor: pointer;
  box-shadow: 0 6px 20px hsl(340 70% 50% / 0.3);
  transition: all 0.3s ease;
  letter-spacing: 2px;
}
.menu-btn-main:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 25px hsl(340 70% 50% / 0.4);
}
.menu-btn-main:active {
  transform: translateY(0);
}
.menu-btn-secondary {
  padding: 12px 24px;
  background: hsl(0 0% 100% / 0.7);
  color: hsl(340, 65%, 45%);
  border: 2px solid hsl(340, 80%, 82%);
  border-radius: 999px;
  font-size: 16px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
}
.menu-btn-secondary:hover {
  background: hsl(340, 100%, 97%);
  border-color: hsl(340, 75%, 72%);
  transform: translateY(-1px);
}
.deco-hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.deco-heart {
  position: absolute;
  color: hsl(340, 80%, 85%);
  opacity: 0.6;
  animation: floatUp 6s ease-in-out infinite;
}
@keyframes floatUp {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
  50% { transform: translateY(-20px) rotate(10deg); opacity: 0.8; }
}
/* ========== 章节选择 ========== */
.chapter-select {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 30px;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 95%, 94%) 100%);
  overflow-y: auto;
}
.chapter-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(24px, 5vw, 36px);
  color: hsl(340, 65%, 45%);
  margin-bottom: 24px;
  text-shadow: 2px 2px 0 hsl(340, 100%, 90%);
}
.chapter-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 640px;
}
.chapter-card {
  padding: 16px 18px;
  background: hsl(0 0% 100% / 0.85);
  border: 2px solid hsl(340, 85%, 88%);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
  box-shadow: 0 4px 12px hsl(340 60% 50% / 0.08);
}
.chapter-card:hover:not(.locked) {
  transform: translateY(-2px);
  border-color: hsl(340, 75%, 72%);
  box-shadow: 0 6px 18px hsl(340 70% 50% / 0.15);
}
.chapter-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
  filter: grayscale(0.5);
}
.chapter-num {
  font-size: 12px;
  color: hsl(270, 50%, 55%);
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.chapter-name {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 18px;
  color: hsl(340, 65%, 45%);
  margin-bottom: 6px;
}
.chapter-desc {
  font-size: 13px;
  color: hsl(240, 15%, 45%);
  line-height: 1.5;
}
.back-btn {
  margin-top: 24px;
  padding: 10px 28px;
  background: hsl(0 0% 100% / 0.7);
  color: hsl(340, 65%, 45%);
  border: 2px solid hsl(340, 80%, 82%);
  border-radius: 999px;
  font-size: 15px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  cursor: pointer;
  transition: all 0.25s ease;
}
.back-btn:hover {
  background: hsl(340, 100%, 97%);
}
/* ========== 游戏内菜单 ========== */
.game-menu {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: hsl(240 20% 20% / 0.4);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
}
.game-menu.show { display: flex; }
.menu-panel {
  background: linear-gradient(135deg,
    hsl(0, 0%, 100%) 0%,
    hsl(340, 100%, 98%) 100%);
  border-radius: 20px;
  border: 2px solid hsl(340, 85%, 85%);
  padding: 28px 32px;
  min-width: 280px;
  max-width: 90vw;
  box-shadow: 0 20px 60px hsl(0 0% 0% / 0.2);
}
.menu-panel-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 22px;
  color: hsl(340, 65%, 45%);
  text-align: center;
  margin-bottom: 18px;
}
.menu-panel-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
/* ========== 好感弹出提示 ========== */
.affection-popup {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  pointer-events: none;
  animation: popupFloat 1.5s ease-out forwards;
}
@keyframes popupFloat {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.8); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); }
  40% { transform: translateX(-50%) translateY(-5px) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(0.9); }
}
.affection-popup-inner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: hsl(0 0% 100% / 0.95);
  border: 2px solid hsl(340, 80%, 75%);
  border-radius: 999px;
  box-shadow: 0 4px 20px hsl(340 70% 50% / 0.3);
}
.affection-popup-text {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 18px;
  color: hsl(340, 70%, 50%);
}
/* ========== 结局画面 ========== */
.ending-screen {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 95%, 94%) 100%);
  padding: 20px;
  text-align: center;
  /* 新增：拦截所有点击，不会穿透到底层对话框 */
  pointer-events: all;
}
.ending-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(28px, 6vw, 48px);
  color: hsl(340, 65%, 45%);
  margin-bottom: 16px;
  text-shadow: 2px 2px 0 hsl(340, 100%, 90%);
  animation: fadeIn 1s ease-out;
}
.ending-text {
  font-size: 16px;
  color: hsl(240, 15%, 35%);
  max-width: 480px;
  line-height: 2;
  margin-bottom: 30px;
  animation: slideUp 1s ease-out 0.3s backwards;
}
/* ========== 快进标识 ========== */
.ff-indicator {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 15;
  padding: 6px 14px;
  background: hsl(340, 80%, 65%);
  color: white;
  border-radius: 999px;
  font-size: 12px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  display: none;
  animation: pulseSoft 1s infinite;
}
.ff-indicator.show { display: block; }
/* ========== 章节过场 ========== */
.chapter-intro {
  position: absolute;
  inset: 0;
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: hsl(340 50% 15% / 0.7);
  backdrop-filter: blur(4px);
  animation: fadeIn 0.5s ease-out;
  pointer-events: none;
}
.chapter-intro-num {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 20px;
  color: hsl(340, 90%, 90%);
  letter-spacing: 4px;
  margin-bottom: 12px;
}
.chapter-intro-name {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(28px, 6vw, 48px);
  color: white;
  text-shadow: 0 2px 20px hsl(340 80% 70% / 0.5);
  margin-bottom: 10px;
}
.chapter-intro-sub {
  font-size: 14px;
  color: hsl(340, 90%, 92%);
  opacity: 0.8;
}
/* ========== 存档面板 ========== */
.save-slots {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 400px;
}
.save-slot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: hsl(340, 100%, 98%);
  border: 1.5px solid hsl(340, 85%, 88%);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.save-slot:hover {
  background: hsl(340, 90%, 95%);

// 通用工具函数
// ========================================================
function $(id) { return document.getElementById(id); }
function safeLS(key, value) {
  try {
    if (value === undefined) {
      return JSON.parse(localStorage.getItem(key) || 'null');
    }
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('localStorage 存储异常', e);
    return null;
  }
}
// 更新好感度进度条
function updateHUD() {
  document.querySelectorAll('.affection-item').forEach(item => {
    const char = item.dataset.char;
    const total = AFFECTION_MAX;
    const percent = Math.min(100, Math.max(0, (state.affection[char] / total) * 100));
    item.querySelector('.affection-fill').style.width = percent + '%';
    const heart = item.querySelector('.affection-heart');
    heart.textContent = percent >= 100 ? '♥' : '♡';
  });
}
// 弹出好感增加提示
function showAffectionPopup(effectStr) {
  if (!effectStr) return;
  const list = effectStr.split(',');
  list.forEach(seg => {
    const match = seg.match(/([c0-9]+)\+(\d+)/);
    if (!match) return;
    const charId = match[1];
    const addNum = parseInt(match[2]);
    state.affection[charId] = Math.min(AFFECTION_MAX, state.affection[charId] + addNum);
    const pop = document.createElement('div');
    pop.className = 'affection-popup';
    pop.innerHTML = `
      <div class="affection-popup-inner">
        <span style="color:hsl(340,75%,60%);font-size:20px;">♥</span>
        <span class="affection-popup-text">${CHAR_NAMES[charId]} 好感 +${addNum}</span>
      </div>
    `;
    $('game-root').appendChild(pop);
    setTimeout(() => pop.remove(), 1500);
  });
  updateHUD();
}
// 应用选项好感效果
function applyAffectionEffect(effectStr) {
  showAffectionPopup(effectStr);
}
// 检测是否解锁隐藏章节
function checkHiddenUnlock() {
  return state.affection.c20 >= AFFECTION_MAX
      && state.affection.c21 >= AFFECTION_MAX
      && state.affection.c24 >= AFFECTION_MAX
      && state.affection.c32 >= AFFECTION_MAX;
}
// 切换背景图/渐变
function setBackground(bgKey) {
  const bgDom = $('bgLayer');
  if (!bgKey) {
    bgDom.style.background = BG_GRADIENTS.hallway;
    bgDom.style.opacity = '1';
    return;
  }
  if (BG_IMAGES[bgKey]) {
    bgDom.style.background = `url("${BG_IMAGES[bgKey]}") center/cover no-repeat`;
  } else if (BG_GRADIENTS[bgKey]) {
    bgDom.style.background = BG_GRADIENTS[bgKey];
  }
  bgDom.style.opacity = '1';
}
// 控制角色立绘显示/淡出
function setCharacters(left, center, right) {
  const elLeft = $('charLeft');
  const elCen = $('charCenter');
  const elRight = $('charRight');

  // 先把所有角色淡出，但不清空图片地址
  elLeft.classList.remove('active');
  elCen.classList.remove('active');
  elRight.classList.remove('active');

  // 不立即清空src，等下一次切换角色时再覆盖，避免中途消失
  // 移除原来的 setTimeout 清空代码！

  // 加载新角色
  if (left && CHAR_IMAGES[left]) {
    elLeft.src = CHAR_IMAGES[left];
    elLeft.classList.add('active');
  } else {
    elLeft.src = ""; // 只有当前无角色才清空
  }
  if (center && CHAR_IMAGES[center]) {
    elCen.src = CHAR_IMAGES[center];
    elCen.classList.add('active');
  } else {
    elCen.src = "";
  }
  if (right && CHAR_IMAGES[right]) {
    elRight.src = CHAR_IMAGES[right];
    elRight.classList.add('active');
  } else {
    elRight.src = "";
  }

  state.charsOnScreen = { left, center, right };
}
// 设置说话角色高亮
function setSpeaking(side) {
  const sides = ['left','center','right'];
  sides.forEach(s => {
    const dom = document.querySelector(`.char-sprite.pos-${s}`);
    dom.classList.remove('speaking','dim');
    if (side && s !== side && dom.classList.contains('active')) dom.classList.add('dim');
    if (side === s) dom.classList.add('speaking');
  });
}
// 文字打字机
function typeText(text, onFinish) {
  clearInterval(state.typeTimer);
  state.isTyping = true;
  state.currentText = text;
  const textDom = $('dialogText');
  textDom.textContent = "";
  $('dialogTriangle').style.display = "none";
  let i = 0;
  state.typeTimer = setInterval(() => {
    textDom.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(state.typeTimer);
      state.isTyping = false;
      $('dialogTriangle').style.display = "block";
      if (onFinish) onFinish();
    }
  }, 40);
}
// 跳过打字
function skipTyping() {
  if (!state.isTyping) return;
  clearInterval(state.typeTimer);
  $('dialogText').textContent = state.currentText;
  state.isTyping = false;
  $('dialogTriangle').style.display = 'block';
}
// 推进剧情
let showingChoice = false;
function nextLine() {
  // 章节开场动画、结局弹窗期间禁止任何点击推进
  if (state.introPlaying) return;
  // 关键新增：如果结局弹窗已经存在，直接拦截所有点击
  if (document.querySelector('.ending-screen')) return;
  if (showingChoice) return;
  // 超出剧情长度直接停止
  if (lineIdx >= chapterData.length) return;
  const line = chapterData[lineIdx];

  // 标签跳转，只移动指针不渲染内容
  if (line.label) {
    lineIdx++;
    nextLine();
    return;
  }
  // goto 跳转指定标记行
  if (line.goto) {
    const target = chapterData.findIndex(item => item.label === line.goto);
    lineIdx = target > -1 ? target : lineIdx + 1;
    nextLine();
    return;
  }
  // 章节结束弹窗，弹出后直接return，不再执行任何后续逻辑
  if (line.ending) {
    showEndingScreen(line);
    // 核心修复：弹出弹窗直接阻断代码，不会再执行下面对话逻辑
    return;
  }

  // 切换背景、角色、说话高亮、震动特效
  if (line.bg) setBackground(line.bg);
  if (line.charLeft !== undefined || line.charCenter !== undefined || line.charRight !== undefined) {
    setCharacters(line.charLeft, line.charCenter, line.charRight);
  }
  if (line.focus) setSpeaking(line.focus);
  if (line.effect === "shake") {
    const root = $('game-root');
    root.style.animation = "none";
    root.offsetHeight;
    root.style.animation = "shakeScreen 0.3s";
  }

  // 出现选项，暂停剧情
  if (line.choice) {
    renderChoices(line.choice);
    return;
  }

  // 切换对话框文字/旁白样式
  const nameDom = $('charName');
  const dialogBox = $('dialogBox');
  dialogBox.classList.remove("narration");
  if (line.narration || line.speaker === "narr") {
    dialogBox.classList.add("narration");
    nameDom.textContent = "";
  } else if (line.speaker === "mc") {
    nameDom.textContent = "我";
    nameDom.style.background = "linear-gradient(135deg, hsl(270,70%,68%), hsl(340,80%,68%))";
  } else if (CHAR_NAMES[line.speaker]) {
    nameDom.textContent = CHAR_NAMES[line.speaker];
    nameDom.style.background = "";
  } else {
    nameDom.textContent = line.speaker || "";
  }

  // 记录当前行，文字打完再标记
  const currentLineNum = lineIdx;
  typeText(line.text, () => {
    state.readFlags[`${state.currentChapter}_${currentLineNum}`] = true;
  });
  // 文字加载完成再增加行数
  lineIdx++;
}
// 渲染选项
function renderChoices(arr) {
  showingChoice = true;
  const wrap = $('choiceContainer');
  wrap.style.display = 'flex';
  wrap.innerHTML = '';
  arr.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.text;
    btn.onclick = ()=>{
      if(opt.effect) applyAffectionEffect(opt.effect);
      wrap.style.display = 'none';
      showingChoice = false;
      if(opt.next) lineIdx = chapterData.findIndex(i=>i.label===opt.next);
      nextLine();
    };
    wrap.appendChild(btn);
  });
}
// 章节开场动画
function showChapterIntro(num, cb) {
  state.introPlaying = true;
  const meta = CHAPTER_META[num];
  const div = document.createElement('div');
  div.className = 'chapter-intro';
  div.innerHTML = `<div class="chapter-int-num">${meta.num}</div><div class="chapter-int-name">${meta.name}</div><div class="chapter-int-sub">～高地探险篇～</div>`;
  $('game-root').appendChild(div);
  setTimeout(()=>{
    div.style.opacity = '0';
    setTimeout(()=>{
      div.remove();
      state.introPlaying = false;
      cb && cb();
    },600);
  },2000);
}
// 结局弹窗
function showEndingScreen(lineData) {
  const wrap = document.createElement('div');
  wrap.className = 'ending-screen';
  let title = lineData.text;
  let desc = '';
  if(lineData.finalEnding){
    title = '✨ 真结局 · 完 ✨';
    desc = '四位少年的高地冒险到此落幕，往后校园时光，仍会一起奔赴各处天台晚风。';
  }else if(lineData.chapterEnd){
    const n = lineData.nextChapter;
    // 通关自动解锁下一章
    if (n < state.chapterUnlocked.length) {
  state.chapterUnlocked[n] = true;
  saveProgress();
}
    if(n === 6 && checkHiddenUnlock()) desc = '全员好感已达标，隐藏星空章节已解锁！';
    else if(n === 6) desc = '提升四人全部好感，解锁隐藏结局';
    else desc = `下一章节：${CHAPTER_META[n].name}`;
  }
  let btns = '';
  if(!lineData.finalEnding && lineData.nextChapter !== undefined && lineData.next <6){
    btns += `<button class="menu-btn-main" id="nextChapBtn">下一章</button>`;
  }
  if(lineData.nextChapter ===6 && checkHiddenUnlock()){
    btns += `<button class="menu-btn-main" id="hiddenChapBtn">进入隐藏章</button>`;
  }
  btns += `<button class="menu-btn-secondary" id="backTitleBtn">返回标题</button>`;
  wrap.innerHTML = `
    <div class="ending-title">${title}</div>
    <div class="ending-text" style="white-space:pre-line;">${desc}</div>
    <div style="display:flex;flex-direction:column;gap:12;width:min(260px,90%)">${btns}</div>
  `;
  $('game-root').appendChild(wrap);
  const nextBtn = document.getElementById('nextChapBtn');
  if (nextBtn) nextBtn.onclick = () => { wrap.remove(); startChapter(lineData.nextChapter); };
  const hiddenBtn = document.getElementById('hiddenChapBtn');
  if (hiddenBtn) hiddenBtn.onclick = () => { wrap.remove(); startChapter(6); };
  $('backTitleBtn').onclick = () => { wrap.remove(); goToTitle(); };
  saveProgress();
}
// 开启章节
let chapterData = [];
let lineIdx = 0;
function startChapter(num) {
  if(num ===6 && !checkHiddenUnlock()){
    alert('需要四位男生好感全部满值才能开启隐藏星空章节！');
    return;
  }
  state.currentChapter = num;
  state.activeChapter = num;
  chapterData = getChapterData(num);
  lineIdx = 0;
  showingChoice = false;
  setCharacters(null,null,null);
  $('mainMenu').style.display = 'none';
  $('chapterSelect').style.display = 'none';
  $('gameMenu').classList.remove('show');
  $('dialogBox').style.display = 'block';
  $('choiceContainer').style.display = 'none';
  $('hud').style.display = state.hudVisible ? 'flex' : 'none';
  showChapterIntro(num, nextLine);
}
// 存档常量
const SAVE_STORAGE_KEY = 'otome_highland_save_v2';
const PROGRESS_STORAGE_KEY = 'otome_progress_v2';
// 获取存档
function getAllSaves() {
  return safeLS(SAVE_STORAGE_KEY) || [null,null,null];
}
function writeSaveList(arr) {
  safeLS(SAVE_STORAGE_KEY, arr);
}
function saveToSlot(i) {
  const arr = getAllSaves();
  arr[i] = {
    chapter: state.currentChapter,
    line: lineIdx,
    affection: {...state.affection},
    unlockList: [...state.chapterUnlocked],
    time: Date.now(),
    chapName: CHAPTER_META[state.currentChapter].name
  };
  writeSaveList(arr);
  renderSavePanel();
}
function loadSlot(i) {
  const arr = getAllSaves();
  const data = arr[i];
  if(!data) return false;
  state.affection = {...data.affection};
  state.chapterUnlocked = [...data.unlockList];
  updateHUD();
  $('saveMenu').classList.remove('show');
  $('gameMenu').classList.remove('show');
  startChapterFromPoint(data.chapter, data.line);
  return true;
}
function startChapterFromPoint(chap, targetLine) {
  state.currentChapter = chap;
  state.activeChapter = chap;
  chapterData = getChapterData(chap);
  lineIdx = 0;
  showingChoice = false;
  setCharacters(null,null,null);
  $('mainMenu').style.display = 'none';
  $('chapterSelect').style.display = 'none';
  $('dialogBox').style.display = 'block';
  $('choiceContainer').style.display = 'none';
  let lastBg = null, lc=null, cc=null, rc=null;
  for(let i=0;i<targetLine;i++){
    const d = chapterData[i];
    if(d.bg) lastBg = d.bg;
    if(d.charLeft !== undefined) lc = d.charLeft;
    if(d.charCenter !== undefined) cc = d.charCenter;
    if(d.charRight !== undefined) rc = d.charRight;
  }
  if(lastBg) setBackground(lastBg);
  setCharacters(lc,cc,rc);
  lineIdx = targetLine;
  showChapterIntro(chap, nextLine);
}
// 自动存档
function saveProgress() {
  safeLS(PROGRESS_STORAGE_KEY, {
    lastChap: state.activeChapter,
    unlock: [...state.chapterUnlocked],
    affection: {...state.affection}
  });
}
// 修复：正确函数名 function 不再是ffunction
function loadLastProgress() {
  const data = safeLS(PROGRESS_STORAGE_KEY);
  if(!data) return;
  if(data.unlock) state.chapterUnlocked = data.unlock;
  if(data.affection) state.affection = data.affection;
  updateHUD();
}
// 渲染存档面板
function renderSavePanel() {
  const wrap = $('saveSlots');
  wrap.innerHTML = '';
  const saves = getAllSaves();
  saves.forEach((slotData,i)=>{
    const div = document.createElement('div');
    div.className = 'save-slot';
    if(slotData){
      const d = new Date(slotData.time);
      const t = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes()}`;
      div.innerHTML = `
        <div class="save-slot-info">
          <div class="save-slot-chapter">${slotData.chapName}</div>
	  <div class="save-slot-detail">进度行：${slotData.line} | ${t}</div>
        </div>
        <span>存档${i+1}</span>
      `;
    }else{
      div.innerHTML = `<div class="save-slot-info"><div class="save-slot-empty">空存档位</div></div><span>存档${i+1}</span>`;
    }
    div.onclick = ()=>{
      if(state.menuMode === 'save') saveTo(i);
      else if(slotData) loadSlot(i);
    };
    wrap.appendChild(div);
  });
}
// 返回标题
function goToTitle() {
  clearInterval(state.typeTimer);
  state.isTyping = false;
  state.fastForward = false;
  showingChoice = false;
  state.screen = 'menu';
  $('mainMenu').style.display = 'flex';
  $('chapterSelect').style.display = 'none';
  $('gameMenu').classList.remove('show');
  $('saveMenu').classList.remove('show');
  $('dialogBox').style.display = 'none';
  $('choiceContainer').style.display = 'none';
  $('hud').style.display = 'none';
  $('ffIndicator').classList.remove('show');
  setCharacters(null,null,null);
  setBackground(null);
  saveProgress();
}
// 渲染章节列表
function renderChapterSelectList() {
  const wrap = $('chapterList');
  wrap.innerHTML = '';
  CHAPTER_META.forEach((meta,idx)=>{
    const card = document.createElement('div');
    const lock = !state.chapterUnlocked[idx] && idx !==6;
    card.className = 'chapter-card' + (lock ? ' locked' : '');
    card.innerHTML = `
      <div class="chapter-num">${meta.num}</div>
      <div class="chapter-name">${lock ? '🔒 '+meta.name : meta.name}</div>
      <div class="chapter-desc">${meta.desc}</div>
    `;
    if(!lock){
      card.onclick = ()=>{
        $('chapterSelect').style.display = 'none';
        startChapter(idx);
      };
    }
    wrap.appendChild(card);
  });
}
// 绑定全部点击事件
function bindAllEvents() {
  // 主菜单按钮
  $('btnNewGame').onclick = ()=>{
    state.affection = {c20:0,c21:0,c24:0,c32:0};
    state.chapterUnlocked = [true,false,false,false,false,false,false];
    updateHUD();
    startChapter(0);
  };
  $('btnContinue').onclick = ()=>{
    const p = safeLS(PROGRESS_STORAGE_KEY);
    if(p && p.lastChap !== undefined) startChapter(p.lastChap);
    else startChapter(0);
  };
  $('btnChapterSelect').onclick = ()=>{
    renderChapterSelectList();
    $('chapterSelect').style.display = 'flex';
  };
  $('btnChapterBack').onclick = ()=> $('chapterSelect').style.display = 'none';
  $('btnLoadGame').onclick = ()=>{
    state.menuMode = 'load';
    $('saveMenuTitle').textContent = '读取存档';
    renderSavePanel();
    $('saveMenu').classList.add('show');
  };
  // 对话框点击
  $('dialogBox').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(showingChoice) return;
    if(state.isTyping) skipTyping();
    else nextLine();
  });
  // 右上角菜单
  $('menuBtn').addEventListener('click', e=>{
    e.stopPropagation();
    $('gameMenu').classList.add('show');
  });
  // 游戏内菜单按钮
  $('btnResume').onclick = ()=> $('gameMenu').classList.remove('show');
  $('btnSave').onclick = ()=>{
    state.menuMode = 'save';
    $('saveMenuTitle').textContent = '保存存档';
    renderSavePanel();
    $('saveMenu').classList.add('show');
  };
  $('btnLoad').onclick = ()=>{
    state.menuMode = 'load';
    $('saveMenuTitle').textContent = '读取存档';
    renderSavePanel();
  };
  $('btnToggleHud').onclick = ()=>{
    state.hudVisible = !state.hudVisible;
    $('hud').style.display = state.hudVisible ? 'flex' : 'none';
  };
  $('btnBackToTitle').onclick = ()=>{
    $('gameMenu').classList.remove();
    goToTitle();
  };
  $('btnSaveBack').onclick = ()=> $('saveMenu').classList.remove('show');
  // 点击遮罩关闭弹窗
  $('gameMenu').addEventListener('click', e=>{
    if(e.target === $('gameMenu')) $('gameMenu').classList.remove('show');
  });
  $('saveMenu').addEventListener('click', e=>{
    if(e.target === $('saveMenu')) $('saveMenu').classList.remove('show');
  });
  // 键盘快捷键
  document.addEventListener('keydown', e=>{
    if($('gameMenu').classList.contains('show') || $('saveMenu').classList.contains('show')) return;
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if(showingChoice) return;
      if(state.isTyping) skipTyping();
      else nextLine();
    }
    if(e.key === 'Escape') $('gameMenu').classList.toggle('show');
    if(e.ctrlKey){
      state.fastForward = true;
      $('ffIndicator').classList.add('show');
      if(state.isTyping) skipTyping();
    }
  });
  document.addEventListener('keyup', e=>{
    if(e.key === 'Control'){
      state.fastForward = false;
      $('ffIndicator').classList.remove('show');
    }
  });
  // 移动端长按快进
  let ffTimer = null;
  $('dialogBox').addEventListener('touchstart', ()=>{
    if(showingChoice) return;
    ffTimer = setTimeout(()=>{
      state.fastForward = true;
      $('ffIndicator').classList.add('show');
      if(state.isTyping) skipTyping();
    },600);
  });
  $('dialogBox').addEventListener('touchend', ()=>{
    clearTimeout(ffTimer);
    state.fastForward = false;
    $('ffIndicator').classList.remove('show');
  });
}
// 页面初始化
function initGame() {
  createDecoHearts();
  loadLastProgress();
  bindAllEvents();
  updateHUD();
  $('dialogBox').style.display = 'none';
  $('hud').style.display = 'none';
}
// 主菜单漂浮爱心
function createDecoHearts() {
  const wrap = $('decoHearts');
  wrap.innerHTML = ''; // 新增清空
  const icons = ['♡','♥','❀','✿'];
  for(let i=0;i<16;i++){
    const el = document.createElement('div');
    el.className = 'deco-heart';
    el.textContent = icons[Math.floor(Math.random()*icons.length)];
    el.style.left = Math.random()*100 + '%';
    el.style.top = Math.random()*100 + '%';
    el.style.fontSize = (12 + Math.random()*22) + 'px';
    el.style.animationDelay = Math.random()*4 + 's';
    wrap.appendChild(el);
  }
}
// 震动动画样式
const shakeStyle = document.createElement('style');
shakeStyle.textContent = `
@keyframes shakeScreen {
  0%{transform:translateX(0px)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
  100%{transform:translateX(0px)}
}
`;
document.head.appendChild(shakeStyle);
// 页面加载完成启动
document.addEventListener('DOMContentLoaded', initGame);
</script>
</div>
