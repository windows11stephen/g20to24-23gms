<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>完了！我被男同学包围了～高地探险篇～</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          pink: {
            50:  'hsl(340, 100%, 98%)',
            100: 'hsl(340, 95%, 94%)',
            200: 'hsl(340, 90%, 88%)',
            300: 'hsl(340, 85%, 78%)',
            400: 'hsl(340, 80%, 68%)',
            500: 'hsl(340, 75%, 60%)',
            600: 'hsl(340, 70%, 50%)',
          },
          purple: {
            soft: 'hsl(270, 80%, 92%)',
            deep: 'hsl(270, 60%, 50%)',
          },
          cream: 'hsl(40, 80%, 98%)',
        },
        fontFamily: {
          title: ['"ZCOOL KuaiLe"', '"Ma Shan Zheng"', 'sans-serif'],
          body: ['"Noto Serif SC"', 'serif'],
          cute: ['"Ma Shan Zheng"', 'cursive'],
        },
        boxShadow: {
          soft: '0 8px 30px hsl(340 80% 70% / 0.2)',
          glow: '0 0 20px hsl(340 90% 75% / 0.5)',
        },
        animation: {
          'float': 'float 3s ease-in-out infinite',
          'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
          'fade-in': 'fadeIn 0.6s ease-out',
          'slide-up': 'slideUp 0.5s ease-out',
          'heart-beat': 'heartBeat 1.2s ease-in-out infinite',
          'sparkle': 'sparkle 1.5s ease-in-out infinite',
        },
        keyframes: {
          float: {
            '0%, 100%': { transform: 'translateY(0)' },
            '50%': { transform: 'translateY(-10px)' },
          },
          pulseSoft: {
            '0%, 100%': { opacity: '1' },
            '50%': { opacity: '0.6' },
          },
          fadeIn: {
            '0%': { opacity: '0' },
            '100%': { opacity: '1' },
          },
          slideUp: {
            '0%': { opacity: '0', transform: 'translateY(20px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          heartBeat: {
            '0%, 100%': { transform: 'scale(1)' },
            '15%': { transform: 'scale(1.25)' },
            '30%': { transform: 'scale(1)' },
            '45%': { transform: 'scale(1.15)' },
            '60%': { transform: 'scale(1)' },
          },
          sparkle: {
            '0%, 100%': { opacity: '0', transform: 'scale(0.5) rotate(0deg)' },
            '50%': { opacity: '1', transform: 'scale(1) rotate(180deg)' },
          },
        },
      }
    }
  };
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img, video { max-width: 100%; height: auto; display: block; }
body { overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: '"Noto Serif SC"', serif;
}

#game-root {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: hsl(340, 95%, 94%);
  user-select: none;
  -webkit-user-select: none;
}

/* ========== 背景层 ========== */
.bg-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.8s ease;
  z-index: 0;
}

.bg-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(340, 95%, 94%) 50%,
    hsl(270, 90%, 94%) 100%);
  z-index: 0;
}

.bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, hsl(340 50% 20% / 0.35) 100%);
  z-index: 1;
  pointer-events: none;
}

/* ========== 角色立绘 ========== */
.char-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.char-sprite {
  position: absolute;
  bottom: 0;
  height: 85%;
  max-height: 85vh;
  object-fit: contain;
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: translateY(30px);
  filter: drop-shadow(0 10px 20px hsl(340 40% 30% / 0.2));
}

.char-sprite.pos-left   { left: -5%;  }
.char-sprite.pos-center { left: 50%; transform: translateX(-50%) translateY(0); }
.char-sprite.pos-right  { right: -5%; }

.char-sprite.active {
  opacity: 1;
}

.char-sprite.active.pos-left   { transform: translateX(0) translateY(0); }
.char-sprite.active.pos-right  { transform: translateX(0) translateY(0); }
.char-sprite.active.pos-center { transform: translateX(-50%) translateY(0); }

.char-sprite.dim {
  filter: drop-shadow(0 10px 20px hsl(340 40% 30% / 0.15)) brightness(0.6) saturate(0.7);
  opacity: 0.5;
}

.char-sprite.speaking {
  transform: translateY(-8px) scale(1.02);
  filter: drop-shadow(0 15px 25px hsl(340 50% 40% / 0.3));
}

.char-sprite.pos-center.speaking {
  transform: translateX(-50%) translateY(-8px) scale(1.03);
}

@media (max-width: 640px) {
  .char-sprite { height: 70%; }
  .char-sprite.pos-left   { left: -15%; }
  .char-sprite.pos-right  { right: -15%; }
}

/* ========== 对话框 ========== */
.dialog-box {
  position: absolute;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 720px;
  background: linear-gradient(135deg,
    hsl(0, 0%, 100%) 0%,
    hsl(340, 100%, 98%) 100%);
  border-radius: 20px;
  border: 2px solid hsl(340, 85%, 85%);
  padding: 20px 24px 20px;
  box-shadow: 0 8px 32px hsl(340 60% 50% / 0.15),
              inset 0 1px 0 hsl(0 0% 100% / 0.8);
  z-index: 10;
  cursor: pointer;
}

.dialog-box::before {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  border-radius: 22px;
  background: linear-gradient(135deg, hsl(340, 90%, 80%), hsl(270, 80%, 85%));
  z-index: -1;
  opacity: 0.5;
  filter: blur(8px);
}

.char-name {
  display: inline-block;
  padding: 4px 16px;
  background: linear-gradient(135deg, hsl(340, 80%, 68%), hsl(270, 70%, 68%));
  color: white;
  border-radius: 999px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px hsl(340 70% 50% / 0.3);
}

.dialog-text {
  color: hsl(240, 20%, 25%);
  font-size: 17px;
  line-height: 1.8;
  min-height: 60px;
  white-space: pre-wrap;
  word-break: break-word;
}

@media (max-width: 640px) {
  .dialog-box { bottom: 16px; padding: 14px 16px; border-radius: 16px; }
  .char-name { font-size: 14px; padding: 3px 12px; }
  .dialog-text { font-size: 15px; line-height: 1.7; min-height: 50px; }
}

.triangle {
  position: absolute;
  right: 20px;
  bottom: 12px;
  width: 10px;
  height: 10px;
  border-right: 2px solid hsl(340, 70%, 60%);
  border-bottom: 2px solid hsl(340, 70%, 60%);
  transform: rotate(45deg);
  animation: triangleBounce 1s ease-in-out infinite;
}

@keyframes triangleBounce {
  0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 1; }
  50% { transform: rotate(45deg) translate(3px, 3px); opacity: 0.5; }
}

/* ========== 选项按钮 ========== */
.choice-container {
  position: absolute;
  left: 50%;
  bottom: 180px;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 560px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: slideUp 0.4s ease-out;
}

.choice-btn {
  width: 100%;
  padding: 14px 20px;
  background: linear-gradient(135deg,
    hsl(0, 0%, 100%) 0%,
    hsl(340, 100%, 97%) 100%);
  border: 2px solid hsl(340, 80%, 80%);
  border-radius: 14px;
  color: hsl(340, 70%, 40%);
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
  box-shadow: 0 4px 12px hsl(340 60% 50% / 0.1);
  position: relative;
  overflow: hidden;
}

.choice-btn::before {
  content: '♡';
  margin-right: 10px;
  color: hsl(340, 70%, 65%);
  font-size: 14px;
}

.choice-btn:hover {
  transform: translateY(-2px);
  border-color: hsl(340, 75%, 65%);
  box-shadow: 0 6px 20px hsl(340 70% 50% / 0.2);
  background: linear-gradient(135deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 90%, 95%) 100%);
}

.choice-btn:active {
  transform: translateY(0);
}

@media (max-width: 640px) {
  .choice-container { bottom: 140px; gap: 8px; }
  .choice-btn { padding: 12px 16px; font-size: 14px; border-radius: 12px; }
}

/* ========== HUD 好感度 ========== */
.hud {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  background: hsl(0 0% 100% / 0.85);
  backdrop-filter: blur(8px);
  border-radius: 14px;
  border: 1.5px solid hsl(340, 85%, 88%);
  box-shadow: 0 4px 16px hsl(340 50% 40% / 0.1);
}

.affection-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}

.affection-name {
  color: hsl(240, 15%, 35%);
  white-space: nowrap;
  width: 48px;
  font-weight: 500;
}

.affection-bar {
  width: 60px;
  height: 6px;
  background: hsl(340, 30%, 90%);
  border-radius: 999px;
  overflow: hidden;
}

.affection-fill {
  height: 100%;
  background: linear-gradient(90deg, hsl(340, 85%, 70%), hsl(270, 70%, 70%));
  border-radius: 999px;
  transition: width 0.5s ease;
  box-shadow: 0 0 6px hsl(340 80% 65% / 0.5);
}

.affection-heart {
  color: hsl(340, 75%, 60%);
  font-size: 10px;
  width: 12px;
}

/* 菜单按钮 */
.menu-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 16;
  width: 40px;
  height: 40px;
  display: none;
  align-items: center;
  justify-content: center;
  background: hsl(0 0% 100% / 0.85);
  backdrop-filter: blur(8px);
  border: 1.5px solid hsl(340, 85%, 88%);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 10px hsl(340 50% 40% / 0.1);
}

.hud-active + .menu-btn { display: none; }

/* ========== 主菜单 ========== */
.main-menu {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 95%, 94%) 100%);
  overflow: hidden;
}

.main-menu::before {
  content: '';
  position: absolute;
  top: -20%;
  left: -10%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, hsl(340, 90%, 85%) 0%, transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}

.main-menu::after {
  content: '';
  position: absolute;
  bottom: -20%;
  right: -10%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, hsl(270, 85%, 85%) 0%, transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}

.game-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(28px, 6vw, 56px);
  color: hsl(340, 65%, 45%);
  text-align: center;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 hsl(340, 100%, 90%),
               4px 4px 16px hsl(340 70% 50% / 0.2);
  line-height: 1.3;
  z-index: 1;
  animation: float 4s ease-in-out infinite;
}

.game-subtitle {
  font-family: '"Ma Shan Zheng"', cursive;
  font-size: clamp(16px, 3vw, 24px);
  color: hsl(270, 50%, 50%);
  margin-bottom: 40px;
  z-index: 1;
  opacity: 0.85;
}

.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 1;
  width: min(280px, 80%);
}

.menu-btn-main {
  padding: 14px 28px;
  background: linear-gradient(135deg, hsl(340, 80%, 70%), hsl(270, 70%, 70%));
  color: white;
  border: none;
  border-radius: 999px;
  font-size: 18px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  cursor: pointer;
  box-shadow: 0 6px 20px hsl(340 70% 50% / 0.3);
  transition: all 0.3s ease;
  letter-spacing: 2px;
}

.menu-btn-main:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 25px hsl(340 70% 50% / 0.4);
}

.menu-btn-main:active {
  transform: translateY(0);
}

.menu-btn-secondary {
  padding: 12px 24px;
  background: hsl(0 0% 100% / 0.7);
  color: hsl(340, 65%, 45%);
  border: 2px solid hsl(340, 80%, 82%);
  border-radius: 999px;
  font-size: 16px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
}

.menu-btn-secondary:hover {
  background: hsl(340, 100%, 97%);
  border-color: hsl(340, 75%, 72%);
  transform: translateY(-1px);
}

.deco-hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.deco-heart {
  position: absolute;
  color: hsl(340, 80%, 85%);
  opacity: 0.6;
  animation: floatUp 6s ease-in-out infinite;
}

@keyframes floatUp {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
  50% { transform: translateY(-20px) rotate(10deg); opacity: 0.8; }
}

/* ========== 章节选择 ========== */
.chapter-select {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 30px;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 95%, 94%) 100%);
  overflow-y: auto;
}

.chapter-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(24px, 5vw, 36px);
  color: hsl(340, 65%, 45%);
  margin-bottom: 24px;
  text-shadow: 2px 2px 0 hsl(340, 100%, 90%);
}

.chapter-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 640px;
}

.chapter-card {
  padding: 16px 18px;
  background: hsl(0 0% 100% / 0.85);
  border: 2px solid hsl(340, 85%, 88%);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
  box-shadow: 0 4px 12px hsl(340 60% 50% / 0.08);
}

.chapter-card:hover:not(.locked) {
  transform: translateY(-2px);
  border-color: hsl(340, 75%, 72%);
  box-shadow: 0 6px 18px hsl(340 70% 50% / 0.15);
}

.chapter-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
  filter: grayscale(0.5);
}

.chapter-num {
  font-size: 12px;
  color: hsl(270, 50%, 55%);
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.chapter-name {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 18px;
  color: hsl(340, 65%, 45%);
  margin-bottom: 6px;
}

.chapter-desc {
  font-size: 13px;
  color: hsl(240, 15%, 45%);
  line-height: 1.5;
}

.back-btn {
  margin-top: 24px;
  padding: 10px 28px;
  background: hsl(0 0% 100% / 0.7);
  color: hsl(340, 65%, 45%);
  border: 2px solid hsl(340, 80%, 82%);
  border-radius: 999px;
  font-size: 15px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  cursor: pointer;
  transition: all 0.25s ease;
}

.back-btn:hover {
  background: hsl(340, 100%, 97%);
}

/* ========== 游戏内菜单 ========== */
.game-menu {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: hsl(240 20% 20% / 0.4);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
}

.game-menu.show { display: flex; }

.menu-panel {
  background: linear-gradient(135deg,
    hsl(0, 0%, 100%) 0%,
    hsl(340, 100%, 98%) 100%);
  border-radius: 20px;
  border: 2px solid hsl(340, 85%, 85%);
  padding: 28px 32px;
  min-width: 280px;
  max-width: 90vw;
  box-shadow: 0 20px 60px hsl(0 0% 0% / 0.2);
}

.menu-panel-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 22px;
  color: hsl(340, 65%, 45%);
  text-align: center;
  margin-bottom: 18px;
}

.menu-panel-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ========== 好感度增长提示 ========== */
.affection-popup {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  pointer-events: none;
  animation: popupFloat 1.5s ease-out forwards;
}

@keyframes popupFloat {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.8); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); }
  40% { transform: translateX(-50%) translateY(-5px) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(0.9); }
}

.affection-popup-inner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: hsl(0 0% 100% / 0.95);
  border: 2px solid hsl(340, 80%, 75%);
  border-radius: 999px;
  box-shadow: 0 4px 20px hsl(340 70% 50% / 0.3);
}

.affection-popup-text {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 18px;
  color: hsl(340, 70%, 50%);
}

/* ========== 结局画面 ========== */
.ending-screen {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,
    hsl(340, 100%, 97%) 0%,
    hsl(270, 95%, 94%) 100%);
  padding: 20px;
  text-align: center;
}

.ending-title {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(28px, 6vw, 48px);
  color: hsl(340, 65%, 45%);
  margin-bottom: 16px;
  text-shadow: 2px 2px 0 hsl(340, 100%, 90%);
  animation: fadeIn 1s ease-out;
}

.ending-text {
  font-size: 16px;
  color: hsl(240, 15%, 35%);
  max-width: 480px;
  line-height: 2;
  margin-bottom: 30px;
  animation: slideUp 1s ease-out 0.3s backwards;
}

/* ========== 快进标识 ========== */
.ff-indicator {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 15;
  padding: 6px 14px;
  background: hsl(340, 80%, 65%);
  color: white;
  border-radius: 999px;
  font-size: 12px;
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  display: none;
  animation: pulseSoft 1s infinite;
}

.ff-indicator.show { display: block; }

/* ========== 章节标题过场 ========== */
.chapter-intro {
  position: absolute;
  inset: 0;
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: hsl(340 50% 15% / 0.7);
  backdrop-filter: blur(4px);
  animation: fadeIn 0.5s ease-out;
}

.chapter-intro-num {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: 20px;
  color: hsl(340, 90%, 90%);
  letter-spacing: 4px;
  margin-bottom: 12px;
}

.chapter-intro-name {
  font-family: '"ZCOOL KuaiLe"', sans-serif;
  font-size: clamp(28px, 6vw, 48px);
  color: white;
  text-shadow: 0 2px 20px hsl(340 80% 70% / 0.5);
  margin-bottom: 10px;
}

.chapter-intro-sub {
  font-size: 14px;
  color: hsl(340, 90%, 92%);
  opacity: 0.8;
}

/* ========== 存档界面 ========== */
.save-slots {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 400px;
}

.save-slot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: hsl(340, 100%, 98%);
  border: 1.5px solid hsl(340, 85%, 88%);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.save-slot:hover {
  background: hsl(340, 90%, 95%);
  border-color: hsl(340, 75%, 75%);
}

.save-slot-info {
  text-align: left;
}

.save-slot-chapter {
  font-size: 14px;
  font-weight: 600;
  color: hsl(340, 65%, 45%);

// ========================================================
// 工具函数
// ========================================================
function $(id) { return document.getElementById(id); }

function safeLS(key, value) {
  try {
    if (value === undefined) {
      return JSON.parse(localStorage.getItem(key) || 'null');
    }
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('localStorage error', e);
    return null;
  }
}

function updateHUD() {
  document.querySelectorAll('.affection-item').forEach(item => {
    const char = item.dataset.char;
    const pct = Math.min(100, Math.max(0, (state.affection[char] / AFFECTION_MAX) * 100));
    item.querySelector('.affection-fill').style.width = pct + '%';
    const heart = item.querySelector('.affection-heart');
    heart.textContent = pct >= 100 ? '♥' : '♡';
    heart.style.color = pct >= 100 ? 'hsl(340, 85%, 55%)' : '';
  });
}

function showAffectionPopup(charKey, amount) {
  const popup = document.createElement('div');
  popup.className = 'affection-popup';
  popup.innerHTML = `
    <div class="affection-popup-inner">
      <span style="font-size:20px;color:hsl(340,75%,60%);">♥</span>
      <span class="affection-popup-text">${CHAR_NAMES[charKey]} 好感度 +${amount}</span>
    </div>
  `;
  $('game-root').appendChild(popup);
  setTimeout(() => popup.remove(), 1500);
}

function applyAffectionEffect(effectStr) {
  if (!effectStr) return;
  const items = effectStr.split(',');
  items.forEach(item => {
    item = item.trim();
    const match = item.match(/(c\d+)\+(\d+)/);
    if (match) {
      const char = match[1];
      const val = parseInt(match[2], 10);
      state.affection[char] = Math.min(AFFECTION_MAX, state.affection[char] + val);
      showAffectionPopup(char, val);
    }
  });
  updateHUD();
}

// 检查隐藏章是否解锁（全员好感度满值）
function checkHiddenUnlock() {
  return state.affection.c20 >= AFFECTION_MAX
      && state.affection.c21 >= AFFECTION_MAX
      && state.affection.c24 >= AFFECTION_MAX
      && state.affection.c32 >= AFFECTION_MAX;
}

// ========================================================
// 背景切换
// ========================================================
function setBackground(bgKey) {
  const bgLayer = $('bgLayer');
  if (!bgKey) {
    bgLayer.style.background = BG_GRADIENTS.hallway;
    bgLayer.style.opacity = '1';
    return;
  }
  // 先检查是不是图片
  if (BG_IMAGES[bgKey]) {
    bgLayer.style.background = `url("${BG_IMAGES[bgKey]}") center/cover no-repeat`;
    bgLayer.style.opacity = '1';
  } else if (BG_GRADIENTS[bgKey]) {
    bgLayer.style.background = BG_GRADIENTS[bgKey];
    bgLayer.style.opacity = '1';
  } else {
    bgLayer.style.background = BG_GRADIENTS.hallway;
    bgLayer.style.opacity = '1';
  }
}

// ========================================================
// 角色立绘控制
// ========================================================
function setCharacters(left, center, right) {
  const leftEl = $('charLeft');
  const centerEl = $('charCenter');
  const rightEl = $('charRight');

  // 左
  if (left && CHAR_IMAGES[left]) {
    leftEl.src = CHAR_IMAGES[left];
    leftEl.alt = CHAR_NAMES[left];
    leftEl.classList.add('active');
  } else {
    leftEl.classList.remove('active');
    setTimeout(() => { if (!leftEl.classList.contains('active')) leftEl.src = ''; }, 600);
  }

  // 中
  if (center && CHAR_IMAGES[center]) {
    centerEl.src = CHAR_IMAGES[center];
    centerEl.alt = CHAR_NAMES[center];
    centerEl.classList.add('active');
  } else {
    centerEl.classList.remove('active');
    setTimeout(() => { if (!centerEl.classList.contains('active')) centerEl.src = ''; }, 600);
  }

  // 右
  if (right && CHAR_IMAGES[right]) {
    rightEl.src = CHAR_IMAGES[right];
    rightEl.alt = CHAR_NAMES[right];
    rightEl.classList.add('active');
  } else {
    rightEl.classList.remove('active');
    setTimeout(() => { if (!rightEl.classList.contains('active')) rightEl.src = ''; }, 600);
  }

  state.charsOnScreen = { left, center, right };
}

function setSpeaking(side) {
  ['left', 'center', 'right'].forEach(s => {
    const el = $('char' + s.charAt(0).toUpperCase() + s.slice(1));
    el.classList.remove('speaking', 'dim');
    if (side && s !== side && el.classList.contains('active')) {
      el.classList.add('dim');
    }
    if (side === s) {
      el.classList.add('speaking');
    }
  });
}

// ========================================================
// 打字机效果
// ========================================================
function typeText(text, callback) {
  const el = $('dialogText');
  $('dialogTriangle').style.display = 'none';
  state.currentText = text;
  state.isTyping = true;

  if (state.fastForward) {
    el.textContent = text;
    state.isTyping = false;
    $('dialogTriangle').style.display = 'block';
    if (callback) callback();
    return;
  }

  let i = 0;
  el.textContent = '';
  clearInterval(state.typeTimer);
  state.typeTimer = setInterval(() => {
    if (i >= text.length) {
      clearInterval(state.typeTimer);
      state.isTyping = false;
      $('dialogTriangle').style.display = 'block';
      if (callback) callback();
      return;
    }
    el.textContent += text[i];
    i++;
  }, 40);
}

function skipTyping() {
  if (state.isTyping) {
    clearInterval(state.typeTimer);
    $('dialogText').textContent = state.currentText;
    state.isTyping = false;
    $('dialogTriangle').style.display = 'block';
  }
}

// ========================================================
// 剧情推进
// ========================================================
let chapterData = [];
let lineIdx = 0;
let showingChoice = false;

function startChapter(chapterIdx) {
  // 检查隐藏章
  if (chapterIdx === 6 && !checkHiddenUnlock()) {
    alert('需要所有角色好感度达到满值才能解锁隐藏章节哦～');
    return;
  }

  state.currentChapter = chapterIdx;
  state.activeChapter = chapterIdx;
  chapterData = getChapterData(chapterIdx);
  lineIdx = 0;
  showingChoice = false;

  // 清空角色
  setCharacters(null, null, null);

  // 隐藏菜单
  $('mainMenu').style.display = 'none';
  $('chapterSelect').style.display = 'none';
  $('gameMenu').classList.remove('show');

  // 显示HUD和对话框
  $('hud').style.display = state.hudVisible ? 'flex' : 'none';
  $('dialogBox').style.display = 'block';
  $('choiceContainer').style.display = 'none';

  // 章节过场
  showChapterIntro(chapterIdx, () => {
    nextLine();
  });
}

function showChapterIntro(chapterIdx, callback) {
  const meta = CHAPTER_META[chapterIdx];
  const intro = document.createElement('div');
  intro.className = 'chapter-intro';
  intro.innerHTML = `
    <div class="chapter-intro-num">${meta.num}</div>
    <div class="chapter-intro-name">${meta.name}</div>
    <div class="chapter-intro-sub">～ 高地探险篇 ～</div>
  `;
  $('game-root').appendChild(intro);
  setTimeout(() => {
    intro.style.transition = 'opacity 0.6s';
    intro.style.opacity = '0';
    setTimeout(() => { intro.remove(); callback && callback(); }, 600);
  }, 2000);
}

function nextLine() {
  if (showingChoice) return;

  if (lineIdx >= chapterData.length) {
    return;
  }

  const line = chapterData[lineIdx];

  // label 跳过
  if (line.label) {
    lineIdx++;
    nextLine();
    return;
  }

  // goto
  if (line.goto) {
    const label = line.goto;
    const idx = chapterData.findIndex(l => l.label === label);
    if (idx >= 0) {
      lineIdx = idx;
      nextLine();
      return;
    }
    lineIdx++;
    nextLine();
    return;
  }

  // ending
  if (line.ending) {
    showEnding(line);
    return;
  }

  // 背景切换
  if (line.bg) {
    setBackground(line.bg);
  }

  // 角色位置
  if (line.charLeft !== undefined || line.charCenter !== undefined || line.charRight !== undefined) {
    const newLeft = line.charLeft !== undefined ? line.charLeft : state.charsOnScreen.left;
    const newCenter = line.charCenter !== undefined ? line.charCenter : state.charsOnScreen.center;
    const newRight = line.charRight !== undefined ? line.charRight : state.charsOnScreen.right;
    setCharacters(newLeft, newCenter, newRight);
  }

  // focus（谁在说话）
  if (line.focus) {
    setSpeaking(line.focus);
  }

  // 特效
  if (line.effect === 'shake') {
    const root = $('game-root');
    root.style.animation = 'none';
    root.offsetHeight; // 触发重绘
    root.style.animation = 'shakeScreen 0.3s ease';
  }

  // 选项
  if (line.choice) {
    showChoices(line.choice);
    return;
  }

  // 显示对话
  const speaker = line.speaker;
  const nameEl = $('charName');
  const dialogBox = $('dialogBox');

  if (line.narration || speaker === 'narr') {
    dialogBox.classList.add('narration');
    nameEl.textContent = '';
  } else if (speaker === 'mc') {
    dialogBox.classList.remove('narration');
    nameEl.textContent = '我';
    nameEl.style.background = 'linear-gradient(135deg, hsl(270, 70%, 68%), hsl(340, 80%, 68%))';
  } else if (speaker && CHAR_NAMES[speaker]) {
    dialogBox.classList.remove('narration');
    nameEl.textContent = CHAR_NAMES[speaker];
    nameEl.style.background = '';
  } else {
    dialogBox.classList.remove('narration');
    nameEl.textContent = speaker || '';
  }

  typeText(line.text || '');

  // 标记已读
  state.readFlags[`${state.currentChapter}_${lineIdx}`] = true;

  lineIdx++;
}

function showChoices(choices) {
  showingChoice = true;
  const container = $('choiceContainer');
  container.innerHTML = '';
  container.style.display = 'flex';

  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.addEventListener('click', () => {
      // 应用好感度
      if (choice.effect) applyAffectionEffect(choice.effect);

      // 隐藏选项
      container.style.display = 'none';
      showingChoice = false;

      // 跳转
      if (choice.next) {
        const idx = chapterData.findIndex(l => l.label === choice.next);
        if (idx >= 0) {
          lineIdx = idx;
          nextLine();
          return;
        }
      }
      nextLine();
    });
    container.appendChild(btn);
  });
}

// ========================================================
// 结局 / 章节结束
// ========================================================
function showEnding(line) {
  // 解锁下一章
  if (line.nextChapter !== undefined && line.nextChapter < CHAPTER_META.length) {
    state.chapterUnlocked[line.nextChapter] = true;
    saveProgress();
  }

  // 创建结局画面
  const screen = document.createElement('div');
  screen.className = 'ending-screen';

  let titleText = line.text || '本章完';
  let descText = '';

  if (line.finalEnding) {
    titleText = '✨ 真结局 · 完 ✨';
    descText = '感谢你陪伴他们走过这段青春时光。\n愿每个人都能找到属于自己的闪闪发光的日子。\n\n— 完了！我被男同学包围了 ～高地探险篇～ —';
  } else if (line.chapterEnd) {
    const nextIdx = line.nextChapter;
    if (nextIdx !== undefined && nextIdx < CHAPTER_META.length) {
      if (nextIdx === 6) {
        // 隐藏章
        descText = checkHiddenUnlock()
          ? '🎉 全员好感度满值！\n隐藏章节「星空下的约定」已解锁！'
          : '继续提升好感度，解锁隐藏剧情吧～';
      } else {
        descText = `下一章：${CHAPTER_META[nextIdx].num} ${CHAPTER_META[nextIdx].name}\n点击继续下一章 →`;
      }
    }
  }

  screen.innerHTML = `
    <div class="ending-title">${titleText}</div>
    <div class="ending-text" style="white-space: pre-line;">${descText}</div>
    <div style="display:flex; flex-direction:column; gap:10px; width:min(240px,80%);">
      ${!line.finalEnding && line.nextChapter !== undefined && line.nextChapter < 6 ?
        `<button class="menu-btn-main" id="btnNextChapter">下 一 章</button>` : ''}
      ${line.chapterEnd && line.nextChapter === 6 && checkHiddenUnlock() ?
        `<button class="menu-btn-main" id="btnHiddenChapter">进入隐藏章</button>` : ''}
      <button class="menu-btn-secondary" id="btnBackTitle">返回标题</button>
    </div>
  `;
  $('game-root').appendChild(screen);

  const nextBtn = $('btnNextChapter');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      screen.remove();
      startChapter(line.nextChapter);
    });
  }
  const hiddenBtn = $('btnHiddenChapter');
  if (hiddenBtn) {
    hiddenBtn.addEventListener('click', () => {
      screen.remove();
      startChapter(6);
    });
  }
  const backBtn = $('btnBackTitle');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      screen.remove();
      goToTitle();
    });
  }

  // 保存进度
  saveProgress();
}

// ========================================================
// 存档 / 读档
// ========================================================
const SAVE_KEY = 'otome_saves_v1';
const PROGRESS_KEY = 'otome_progress_v1';

function getSaves() {
  return safeLS(SAVE_KEY) || [null, null, null];
}

function writeSaves(saves) {
  safeLS(SAVE_KEY, saves);
}

function saveToSlot(slotIdx) {
  const saves = getSaves();
  saves[slotIdx] = {
    chapter: state.currentChapter,
    line: lineIdx,
    affection: { ...state.affection },
    chapterUnlocked: [...state.chapterUnlocked],
    timestamp: Date.now(),
    chapterName: CHAPTER_META[state.currentChapter]?.name || '',
  };
  writeSaves(saves);
  // 刷新列表
  renderSaveSlots();
}

function loadFromSlot(slotIdx) {
  const saves = getSaves();
  const save = saves[slotIdx];
  if (!save) return false;

  state.affection = { ...save.affection };
  state.chapterUnlocked = [...save.chapterUnlocked];
  updateHUD();

  // 关闭菜单
  $('saveMenu').classList.remove('show');
  $('gameMenu').classList.remove('show');

  // 从存档章节的指定行开始
  startChapterFromLine(save.chapter, save.line);
  return true;
}

function startChapterFromLine(chapterIdx, targetLine) {
  state.currentChapter = chapterIdx;
  state.activeChapter = chapterIdx;
  chapterData = getChapterData(chapterIdx);
  lineIdx = 0;
  showingChoice = false;

  setCharacters(null, null, null);
  $('mainMenu').style.display = 'none';
  $('chapterSelect').style.display = 'none';
  $('gameMenu').classList.remove('show');
  $('hud').style.display = state.hudVisible ? 'flex' : 'none';
  $('dialogBox').style.display = 'block';
  $('choiceContainer').style.display = 'none';

  // 快进到目标行（先快速播一遍前面的场景设置）
  // 找到目标行之前最近的 bg/char 设置
  let bg = null;
  let cl = null, cc = null, cr = null;
  for (let i = 0; i < targetLine; i++) {
    const l = chapterData[i];
    if (l.bg) bg = l.bg;
    if (l.charLeft !== undefined) cl = l.charLeft;
    if (l.charCenter !== undefined) cc = l.charCenter;
    if (l.charRight !== undefined) cr = l.charRight;
  }
  if (bg) setBackground(bg);
  if (cl !== null || cc !== null || cr !== null) {
    setCharacters(
      cl !== null ? cl : state.charsOnScreen.left,
      cc !== null ? cc : state.charsOnScreen.center,
      cr !== null ? cr : state.charsOnScreen.right
    );
  }

  lineIdx = targetLine;
  // 章节过场
  showChapterIntro(chapterIdx, () => {
    nextLine();
  });
}

function saveProgress() {
  // 自动保存进度（解锁状态 + 好感度）
  safeLS(PROGRESS_KEY, {
    chapterUnlocked: state.chapterUnlocked,
    affection: { ...state.affection },
    lastChapter: state.activeChapter,
  });
}

function loadProgress() {
  const p = safeLS(PROGRESS_KEY);
  if (p) {
    if (p.chapterUnlocked) state.chapterUnlocked = p.chapterUnlocked;
    if (p.affection) state.affection = p.affection;
    updateHUD();
  }
}

function renderSaveSlots() {
  const saves = getSaves();
  const container = $('saveSlots');
  container.innerHTML = '';
  saves.forEach((save, i) => {
    const slot = document.createElement('div');
    slot.className = 'save-slot';
    if (save) {
      const date = new Date(save.timestamp);
      const timeStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
      slot.innerHTML = `
        <div class="save-slot-info">
          <div class="save-slot-chapter">${CHAPTER_META[save.chapter]?.num || ''} ${save.chapterName || '未知'}</div>
          <div class="save-slot-detail">第 ${save.line} 行 · ${timeStr}</div>
        </div>
        <div style="font-size:12px; color:hsl(240,10%,55%);">存档 ${i+1}</div>
      `;
    } else {
      slot.innerHTML = `
        <div class="save-slot-info">
          <div class="save-slot-chapter save-slot-empty">空存档</div>
          <div class="save-slot-detail save-slot-empty">点击保存到此位置</div>
        </div>
        <div style="font-size:12px; color:hsl(240,10%,55%);">存档 ${i+1}</div>
      `;
    }
    slot.addEventListener('click', () => {
      if (state.menuMode === 'save') {
        saveToSlot(i);
        // 反馈
        const orig = slot.innerHTML;
        slot.innerHTML = `
          <div class="save-slot-info">
            <div class="save-slot-chapter" style="color:hsl(130,60%,40%);">✓ 保存成功</div>
          </div>
        `;
        setTimeout(() => renderSaveSlots(), 800);
      } else {
        if (save) loadFromSlot(i);
      }
    });
    container.appendChild(slot);
  });
}

// ========================================================
// 界面切换
// ========================================================
function goToTitle() {
  state.screen = 'menu';
  clearInterval(state.typeTimer);
  state.isTyping = false;
  showingChoice = false;

  $('mainMenu').style.display = 'flex';
  $('chapterSelect').style.display = 'none';
  $('dialogBox').style.display = 'none';
  $('choiceContainer').style.display = 'none';
  $('hud').style.display = 'none';
  $('gameMenu').classList.remove('show');
  $('saveMenu').classList.remove('show');
  $('ffIndicator').classList.remove('show');
  state.fastForward = false;

  // 清空角色
  setCharacters(null, null, null);
  setBackground(null);

  saveProgress();
}

function showChapterSelect() {
  const list = $('chapterList');
  list.innerHTML = '';
  CHAPTER_META.forEach((meta, i) => {
    const card = document.createElement('div');
    const locked = !state.chapterUnlocked[i];
    card.className = 'chapter-card' + (locked ? ' locked' : '');
    card.innerHTML = `
      <div class="chapter-num">${meta.num}</div>
      <div class="chapter-name">${locked ? '🔒 ' + meta.name : meta.name}</div>
      <div class="chapter-desc">${meta.desc}</div>
    `;
    if (!locked) {
      card.addEventListener('click', () => {
        $('chapterSelect').style.display = 'none';
        startChapter(i);
      });
    }
    list.appendChild(card);
  });

  $('chapterSelect').style.display = 'flex';
}

// ========================================================
// 装饰爱心
// ========================================================
function createDecoHearts() {
  const container = $('decoHearts');
  const hearts = ['♡', '♥', '❀', '✿'];
  for (let i = 0; i < 15; i++) {
    const h = document.createElement('div');
    h.className = 'deco-heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.top = Math.random() * 100 + '%';
    h.style.fontSize = (12 + Math.random() * 20) + 'px';
    h.style.animationDelay = Math.random() * 4 + 's';
    h.style.animationDuration = (4 + Math.random() * 3) + 's';
    container.appendChild(h);
  }
}

// ========================================================
// 事件绑定
// ========================================================
function bindEvents() {
  // 主菜单
  $('btnNewGame').addEventListener('click', () => {
    // 新游戏：重置好感度、解锁、从第一章开始
    state.affection = { c20: 0, c21: 0, c24: 0, c32: 0 };
    state.chapterUnlocked = [true, false, false, false, false, false, false];
    updateHUD();
    startChapter(0);
  });

  $('btnContinue').addEventListener('click', () => {
    const p = safeLS(PROGRESS_KEY);
    if (p && p.lastChapter !== undefined) {
      startChapter(p.lastChapter);
    } else {
      // 没有进度，从第一章开始
      startChapter(0);
    }
  });

  $('btnChapterSelect').addEventListener('click', () => {
    showChapterSelect();
  });

  $('btnLoadGame').addEventListener('click', () => {
    state.menuMode = 'load';
    $('saveMenuTitle').textContent = '读取存档';
    renderSaveSlots();
    $('saveMenu').classList.add('show');
  });

  $('btnChapterBack').addEventListener('click', () => {
    $('chapterSelect').style.display = 'none';
  });

  // 对话框点击
  $('dialogBox').addEventListener('click', (e) => {
    if (showingChoice) return;
    if (state.isTyping) {
      skipTyping();
    } else {
      nextLine();
    }
  });

  // 菜单按钮
  $('menuBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    $('gameMenu').classList.add('show');
  });

  // 游戏菜单
  $('btnResume').addEventListener('click', () => {
    $('gameMenu').classList.remove('show');
  });

  $('btnSave').addEventListener('click', () => {
    state.menuMode = 'save';
    $('saveMenuTitle').textContent = '保存存档';
    renderSaveSlots();
    $('saveMenu').classList.add('show');
  });

  $('btnLoad').addEventListener('click', () => {
    state.menuMode = 'load';
    $('saveMenuTitle').textContent = '读取存档';
    renderSaveSlots();
    $('saveMenu').classList.add('show');
  });

  $('btnToggleHud').addEventListener('click', () => {
    state.hudVisible = !state.hudVisible;
    $('hud').style.display = state.hudVisible ? 'flex' : 'none';
  });

  $('btnBackToTitle').addEventListener('click', () => {
    $('gameMenu').classList.remove('show');
    goToTitle();
  });

  $('btnSaveBack').addEventListener('click', () => {
    $('saveMenu').classList.remove('show');
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (state.screen !== 'playing' && !$('dialogBox').offsetParent) return;
    if ($('gameMenu').classList.contains('show')) return;
    if ($('saveMenu').classList.contains('show')) return;

    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (showingChoice) return;
      if (state.isTyping) {
        skipTyping();
      } else {
        nextLine();
      }
    }
    if (e.key === 'Control') {
      // 按住Ctrl快进
      state.fastForward = true;
      $('ffIndicator').classList.add('show');
      if (state.isTyping) {
        skipTyping();
      }
    }
    if (e.key === 'Escape') {
      $('gameMenu').classList.toggle('show');
    }
  });

  document.addEventListener('keyup', (e) => {
    if (e.key === 'Control') {
      state.fastForward = false;
      $('ffIndicator').classList.remove('show');
    }
  });

  // 长按对话框快进（移动端）
  let ffTimer = null;
  let ffActive = false;
  $('dialogBox').addEventListener('touchstart', (e) => {
    if (showingChoice) return;
    ffTimer = setTimeout(() => {
      state.fastForward = true;
      ffActive = true;
      $('ffIndicator').classList.add('show');
      if (state.isTyping) skipTyping();
    }, 600);
  });
  $('dialogBox').addEventListener('touchend', () => {
    clearTimeout(ffTimer);
    if (ffActive) {
      state.fastForward = false;
      ffActive = false;
      $('ffIndicator').classList.remove('show');
    }
  });

  // 点击游戏菜单背景关闭
  $('gameMenu').addEventListener('click', (e) => {
    if (e.target === $('gameMenu')) {
      $('gameMenu').classList.remove('show');
    }
  });
  $('saveMenu').addEventListener('click', (e) => {
    if (e.target === $('saveMenu')) {
      $('saveMenu').classList.remove('show');
    }
  });
}

// ========================================================
// 初始化
// ========================================================
function init() {
  createDecoHearts();
  loadProgress();
  bindEvents();
  updateHUD();

  // 初始隐藏对话框
  $('dialogBox').style.display = 'none';
  $('hud').style.display = 'none';
}

// 添加屏幕震动动画
const style = document.createElement('style');
style.textContent = `
  @keyframes shakeScreen {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
`;
document.head.appendChild(style);

document.addEventListener('DOMContentLoaded', init);
</script>
